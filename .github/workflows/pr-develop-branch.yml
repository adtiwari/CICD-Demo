# Unique name for this workflow
name: Validate PR on develop branch

# Definition of when the workflow should run
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "force-app/**"
permissions:
  contents: read
  pull-requests: write   # needed to comment on the PR
concurrency:
  group: pr-validate-classes-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "85"
  
jobs:
    perform-setup:
        runs-on: ubuntu-latest
        environment: agentforce
        steps:
            - name: Ensure node v20.9.0 or greater
              uses: actions/setup-node@v4
              with:
                node-version: '>=20.9.0'
            - name: install checkout
              uses: actions/checkout@v3
              with:
                fetch-depth: '2'
            - name: Ensure java v11 or greater
              uses: actions/setup-java@v4
              with:
                java-version: '>=11'
                distribution: 'zulu'
            - name: Ensure python v3.10 or greater
              uses: actions/setup-python@v5
              with:
                python-version: '>=3.10'
            - name: install sfdx
              run: npm install @salesforce/cli --global
            - name: Install Latest Salesforce Code Analyzer CLI Plugin
              run: sf plugins install code-analyzer@latest
            - name: 'Installing sfdx git delta'
              run: |
                  echo Y | sf plugins:install sfdx-git-delta
                  sf plugins
            - name: 'Create delta packages'
              run: | 
                  mkdir changed-sources
                  sf sgd source delta --to "HEAD" --from "HEAD~1" --output changed-sources/ --generate-delta --source force-app/
                  echo "[INFO] Diff generated"
                  cd changed-sources
                  ls -ltrR
            - name: Compute base/head SHAs
              id: shas
              run: |
                echo "base_ref=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
                echo "head_ref=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            - name : Initialize Check variable
              id: init
              run: |
                echo "run_scanner=false" >>$GITHUB_OUTPUT
            - name: Detect changed validation rules
              id: vrulecheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/objects/**/validationRules/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_validationrule_changes=false" >> $GITHUB_OUTPUT
                  echo "No Validation Rule changes detected."
                else
                  echo "has_validationrule_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed Validation Rule files:"
                  echo "$CHANGED"
                fi
            - name: Detect changed Apex classes
              id: classcheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/classes/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_class_changes=false" >> $GITHUB_OUTPUT
                  echo "No Apex class changes detected."
                else
                  echo "has_class_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed Apex class files:"
                  echo "$CHANGED"
                fi
            - name: Detect changed Aura components
              id: auracheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/aura/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_aura_changes=false" >> $GITHUB_OUTPUT
                  echo "No Aura changes detected."
                else
                  echo "has_aura_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed Aura files:"
                  echo "$CHANGED"
                fi                
            - name: Detect changed LWC
              id: lwccheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/lwc/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_lwc_changes=false" >> $GITHUB_OUTPUT
                  echo "No LWC changes detected."
                else
                  echo "has_lwc_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed LWC files:"
                  echo "$CHANGED"
                fi
            - name: Detect changed VF
              id: VFcheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/pages/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_vf_changes=false" >> $GITHUB_OUTPUT
                  echo "No VF changes detected."
                else
                  echo "has_vf_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed VF files:"
                  echo "$CHANGED"
                fi
            - name: Detect changed VFC
              id: vfccheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/components/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_vfc_changes=false" >> $GITHUB_OUTPUT
                  echo "No VFC changes detected."
                else
                  echo "has_vfc_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed VFC files:"
                  echo "$CHANGED"
                fi
            - name: Detect changed trigger
              id: triggercheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/triggers/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_triggers_changes=false" >> $GITHUB_OUTPUT
                  echo "No Triggers changes detected."
                else
                  echo "has_triggers_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed Triggers files:"
                  echo "$CHANGED"
                fi
            - name: Detect changed Flows
              id: flowscheck
              run: |
                CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base_ref }}" "${{ steps.shas.outputs.head_ref }}" -- 'force-app/main/default/flows/**' || true)
                if [ -z "$CHANGED" ]; then
                  echo "has_flows_changes=false" >> $GITHUB_OUTPUT
                  echo "No Flows changes detected."
                else
                  echo "has_flows_changes=true" >> $GITHUB_OUTPUT
                  echo "Changed Flows files:"
                  echo "$CHANGED"
                fi
            - name: 'Evaluate if Scanner is needed'
              id: prescanevaluate
              if: ${{ steps.classcheck.outputs.has_class_changes == 'true' || steps.auracheck.outputs.has_aura_changes == 'true'||steps.lwccheck.outputs.has_lwc_changes == 'true' ||steps.VFcheck.outputs.has_vf_changes == 'true' ||steps.vfccheck.outputs.has_vfc_changes == 'true' ||steps.triggercheck.outputs.has_triggers_changes == 'true' ||steps.flowscheck.outputs.has_flows_changes == 'true' }}
              run: |
                echo "run_scanner=true" >>$GITHUB_OUTPUT
            
            - name: 'Run Scanner'
              id: runscan
              if:  ${{ steps.prescanevaluate.outputs.run_scanner == 'true'}}
              run: |
                  echo "has_findings=false" >> $GITHUB_OUTPUT
                  cd changed-sources
                  ls -ltRr
                  sf code-analyzer run --rule-selector Recommended --workspace . --view table --config-file ../code-analyzer.yml | tee scan-output.txt
                  SCAN_RESULTS=$(cat scan-output.txt | wc -l)
                  echo "data_rows=$SCAN_RESULTS" >> $GITHUB_OUTPUT
                  if [ "$SCAN_RESULTS" -gt 2 ]; then
                    echo "has_findings=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_findings=false" >> $GITHUB_OUTPUT
                  fi
                  cd ..
            - name: Comment scan results on PR
              if: ${{steps.runscan.outputs.has_findings == 'true'}}
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ github.event.pull_request.number }}
                body-file: changed-sources/scan-output.txt
            - name: Tests to Run
              id: testsuite
              if: ${{steps.classcheck.outputs.has_class_changes||steps.triggercheck.outputs.has_triggers_changes == 'true' || steps.vrulecheck.outputs.has_validationrule_changes == 'true' }}
              run: |
                  cd changed-sources
                  FOUND_FILES=$(find force-app/main/default/classes/ -type f -print0 | xargs -0 grep -l "@isTest" | paste -sd ',')
                  if [ -n "$FOUND_FILES" ]; then
                    echo "Files containing  $FOUND_FILES"
                    echo "tests=$FOUND_FILES" >> $GITHUB_OUTPUT
                    echo "test-level=RunSpecifiedTests" >>$GITHUB_OUTPUT
                  else
                    echo "No test files found error stop further '"
                    echo "test-level=RunLocalTests">> $GITHUB_OUTPUT
                  fi
            - name: No Tests to Run
              id: defaultsuite
              if: ${{ steps.classcheck.outputs.has_class_changes == 'false' && steps.triggercheck.outputs.has_triggers_changes == 'false' && steps.vrulecheck.outputs.has_validationrule_changes == 'false' }}
              run: |
                  echo "test-level=NoTestRun">> $GITHUB_OUTPUT
            - name: 'Deploy to environment with running no tests'
              id: deploy_no_tests
              if: ${{ steps.defaultsuite.outputs.test-level == 'NoTestRun'}}
              run: |
                  echo "${{ secrets.JWT_SECRET_KEY }}" > server.key
                  sf org login jwt --username ${{ secrets.DEPLOYMENT_USERNAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default
                  sf project deploy start --source-dir changed-sources/force-app --test-level NoTestRun --wait 60 --json > validate.json
                  pwd
            - name: 'Deploy to environment with running local tests'
              id: deploy_local_tests
              if: ${{ steps.testsuite.outputs.test-level == 'RunLocalTests' || steps.vrulecheck.outputs.has_validationrule_changes == 'true'}}
              run: |
                  echo "${{ secrets.JWT_SECRET_KEY }}" > server.key
                  sf org login jwt --username ${{ secrets.DEPLOYMENT_USERNAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default
                  sf project deploy start --source-dir changed-sources/force-app --test-level RunLocalTests --wait 60 --json > validate.json

                  pwd
            - name: 'Deploy to environment with running specific tests'
              id: deploy_specific_tests
              if: ${{ steps.defaultsuite.outputs.test-level == 'RunSpecifiedTests'}}
              run: |
                  echo "${{ secrets.JWT_SECRET_KEY }}" > server.key
                  sf org login jwt --username ${{ secrets.DEPLOYMENT_USERNAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default
                  sf project deploy start --source-dir changed-sources/force-app --test-level RunSpecifiedTests --tests "$tests" --wait 60 --json > validate.json
                  pwd 
            - name: evaluate Test Coverage 
              id: coverage
              if: ${{ steps.testsuite.outputs.test-level == 'RunLocalTests' || steps.defaultsuite.outputs.test-level == 'RunSpecifiedTests'}}
              run: |
                  node <<'NODE'
                  const fs = require('fs');
        
                  // Read validate JSON (from previous step). The CLI returns a deploy result with runTestResult/codeCoverage.
                  if (!fs.existsSync('validate.json')) {
                    console.error('validate.json not found');
                    process.exit(1);
                  }
                  const raw = JSON.parse(fs.readFileSync('validate.json','utf8'));
        
                  // Try to normalize paths to run test results; sf cli structures can differ slightly by version.
                  let runTests = null;
                  try {
                    // Common locations:
                    // raw.result.details.runTestResult
                    // raw.details.runTestResult
                    // raw.result?.response?.details?.runTestResult (older bridges)
                    runTests = raw?.result?.details?.runTestResult
                           || raw?.details?.runTestResult
                           || raw?.result?.response?.details?.runTestResult
                           || null;
                  } catch (e) {}
        
                  if (!runTests) {
                    console.error('No runTestResult found in validate JSON. Ensure TEST_LEVEL runs tests.');
                  }
        
                  const codeCov = (runTests?.codeCoverage) || [];
                  // Each element generally has: name, numLocations, numLocationsNotCovered, locationsNotCovered[], etc.
                  const byName = new Map();
                  for (const r of codeCov) {
                    const name = r.name || r.typeName || r.ApexClassOrTriggerName || null;
                    const numLoc = Number(r.numLocations || r.NumLocations || 0);
                    const numNot = Number(r.numLocationsNotCovered || r.NumLocationsNotCovered || 0);
                    if (!name) continue;
                    // prefer record with larger denominator
                    const existing = byName.get(name);
                    if (!existing || numLoc > (existing.numLoc || 0)) {
                      byName.set(name, { name, numLoc, numNot });
                    }
                  }
        
                  // Thresholds
                  const avgMin = Number(process.env.DELTA_AVG_MIN_PCT || '85');
                  const perMin = Number(process.env.DELTA_PER_FILE_MIN_PCT || '85');
        
                  const rows = [];
                  let totCovered = 0, totLines = 0;
                  const missing = [];
        
                  for (const u of units) {
                    const rec = byName.get(u);
                    let covered = 0, total = 0, pct = 0;
                    if (rec) {
                      total = rec.numLoc;
                      const not = rec.numNot;
                      covered = Math.max(total - not, 0);
                      pct = total > 0 ? Math.round((covered * 1000) / total) / 10 : 0;
                      totCovered += covered;
                      totLines += total;
                    } else {
                      // No coverage data for this changed unit in validate JSON (new class untested, or no tests touched it)
                      missing.push(u);
                    }
                    rows.push({ name: u, covered, total, pct, found: !!rec });
                  }
        
                  const avgPct = totLines > 0 ? Math.round((totCovered * 1000) / totLines) / 10 : 0;
        
                  // Build summary markdown
                  let md = `### Salesforce Delta Coverage (from Validate JSON)\n\n`;
                  md += `- **Changed Apex units:** ${units.length}\n`;
                  md += `- **Delta average coverage:** ${avgPct}% (min ${avgMin}%)\n`;
                  md += `- **Per-file minimum:** ${perMin}% ${perMin>0 ? '(enforced)' : '(disabled)'}\n`;
                  md += `- **Org:** \`${process.env.TARGET_ALIAS}\`\n\n`;
        
                  if (units.length === 0) {
                    md += `No Apex classes/triggers changed in this PR. Delta coverage gate skipped.\n`;
                    fs.writeFileSync('summary.md', md);
                    // If validate itself failed, we still want to fail the job; signal pass for coverage only
                    console.log(`coverage_pass=true`);
                    process.exit(0);
                  }
        
                  md += `#### Delta Units\n`;
                  md += `| Class/Trigger | Covered | Total | % |\n`;
                  md += `|---|---:|---:|---:|\n`;
                  for (const r of rows) {
                    md += `| ${r.name}${r.found ? '' : ' *(no data in validate)*'} | ${r.covered} | ${r.total} | ${r.pct}% |\n`;
                  }
                  md += `\n`;
        
                  if (missing.length) {
                    md += `> ⚠️ These changed units had **no coverage in the validate JSON** (treated as 0%): ${missing.join(', ')}\n\n`;
                  }
        
                  // Enforce coverage gates
                  const avgFail = avgPct < avgMin;
                  const perFails = perMin > 0 ? rows.filter(r => r.pct < perMin) : [];
                  let fail = false;
                  if (avgFail || perFails.length) {
                    fail = true;
                    if (avgFail) md += `**Result:** ❌ Delta average ${avgPct}% < ${avgMin}%\n`;
                    if (perFails.length) {
                      md += `**Result:** ❌ ${perFails.length} unit(s) below ${perMin}%: `;
                      md += perFails.map(r => `${r.name} (${r.pct}%)`).join(', ') + `\n`;
                    }
                  } else {
                    md += `**Result:** ✅ Delta coverage met thresholds.\n`;
                  }
        
                  fs.writeFileSync('summary.md', md);
                  // Emit pass/fail for later steps (GitHub output)
                  if (fail) process.exit(2);
                  process.exit(0);
                  NODE

            - name: package xml on PR
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ github.event.pull_request.number }}
                body-file: changed-sources/package/package.xml
